  - generic [ref=e19]:
    - paragraph [ref=e20]: Welcome to Teleprompt Pro, your voice-powered teleprompter.
    - paragraph [ref=e21]
    - paragraph [ref=e22]: Just start reading this script out loud, and watch the text scroll along with you. There is no need to set a speed or touch anything while you present.
    - paragraph [ref=e23]
    - paragraph [ref=e24]: If you skip a sentence, improvise for a moment, or stumble over a few words, don't worry. The prompter waits for you, and the moment you return to the script, it picks up right where you are and keeps going.
    - paragraph [ref=e25]
    - paragraph [ref=e26]: You can adjust the font size, colors, and margins from the settings panel, switch to a classic auto-scroll mode, or nudge the position with the arrow keys at any time.
    - paragraph [ref=e27]
    - paragraph [ref=e28]: When you are ready, create your own script from the library, press present, and enjoy hands-free reading. Good luck with your recording!
